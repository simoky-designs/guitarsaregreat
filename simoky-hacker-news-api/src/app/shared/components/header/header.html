<header class="global-header">
  <h1>{{ appName }}</h1>
</header>
<div class="nav-bar"  aria-label="Story type filters">
  @for (btn of storyTypeButtons; track btn.type) {
    <app-button
      type="button"
      [pressed]="btn.type === storyType()"
      [disabled]="btn.disabled"
      (clicked)="setStoryType(btn.type)"
    >
      {{ storyTypeLabels[btn.type] }}
    </app-button>
  }
</div>
<h2 class="title">{{ title() }}</h2>
