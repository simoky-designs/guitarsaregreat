<header class="global-header">
  <h1>{{ appName }}</h1>
</header>
<div class="nav-bar">
  @for (btn of storyTypeButtons; track btn.type) {
    <app-button
      type="button"
      [disabled]="btn.disabled"
      (clicked)="setStoryType(btn.type)"
    >
      {{ storyTypeLabels[btn.type] }}
    </app-button>
  }
</div>
<h3 class="title">{{ title() }}</h3>
