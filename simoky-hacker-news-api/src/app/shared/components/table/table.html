<table
	mat-table
	[dataSource]="dataSource"
	matSort
	[matSortActive]="sortActive"
	[matSortDirection]="sortDirection"
	(matSortChange)="sortChange.emit($event)"
	multiTemplateDataRows
	class="mat-shadow-2"
>
	@for (column of columnEntries; track column.key) {
		<ng-container matColumnDef="{{ column.key }}">
			<th mat-header-cell *matHeaderCellDef mat-sort-header>{{ column.label }}</th>
			<td mat-cell *matCellDef="let element">{{ element[column.key] }}</td>
		</ng-container>
	}

	<ng-container matColumnDef="expand">
		<th mat-header-cell *matHeaderCellDef aria-label="row actions">&nbsp;</th>
		<td mat-cell *matCellDef="let element">
			<button
				matIconButton
				aria-label="expand row"
				(click)="toggle(element); $event.stopPropagation()"
				class="toggle-button"
				[class.toggle-button-expanded]="isExpanded(element)"
			>
				<mat-icon>keyboard_arrow_down</mat-icon>
			</button>
		</td>
	</ng-container>

	@if (detailTemplate) {
		<ng-container matColumnDef="expandedDetail">
			<td mat-cell *matCellDef="let element" [attr.colspan]="columnsWithExpand.length">
				<div
					class="element-detail-wrapper"
					[class.element-detail-wrapper-expanded]="isExpanded(element)"
				>
					<div class="element-detail">
						<ng-container
							*ngTemplateOutlet="detailTemplate; context: { $implicit: element }"
						></ng-container>
					</div>
				</div>
			</td>
		</ng-container>
	}

	<tr mat-header-row *matHeaderRowDef="columnsWithExpand"></tr>
	<tr
		mat-row
		*matRowDef="let element; columns: columnsWithExpand"
		class="element-row"
		[class.expanded-row]="isExpanded(element)"
		(click)="toggle(element)"
	></tr>
	@if (detailTemplate) {
		<tr mat-row *matRowDef="let row; columns: ['expandedDetail']" class="detail-row"></tr>
	}
</table>
