<div class="page">
  <header class="page-header"></header>
  @if (!queryService.loading() && dataSource.data.length === 0) {
    <div class="no-data-container">
      <p>No data available.</p>
    </div>
  } @else if (!queryService.loading()) {
    <app-table
      [dataSource]="dataSource"
      [columns]="columnsToDisplay"
      sortActive="score"
      sortDirection="asc"
      [detailTemplate]="expandedDetail"
      (sortChange)="onSortChange($event)"
    >
    </app-table>

    <ng-template #expandedDetail let-element>
      <div class="element-diagram">
        <div>
          <strong>URL:</strong>
          <a [href]="element.url" target="_blank" rel="noopener">{{ element.url }}</a>
        </div>
        <div><strong>Domain:</strong> {{ element.domain || '-' }}</div>
        <div><strong>Points:</strong> {{ element.points ?? 0 }}</div>
        <div><strong>Comments:</strong> {{ element.comments ?? 0 }}</div>
        <div><strong>Posted:</strong> {{ element.postedAt | date }}</div>
      </div>
    </ng-template>

    <app-paginator
      [length]="queryService.response()?.total ?? 0"
      [pageSize]="pageSize()"
      [pageIndex]="pageIndex()"
      [showFirstLastButtons]="showFirstLastButtons()"
      [pageSizeOptions]="pageSizeOptions"
      (pageChange)="onPageChange($event)"
    ></app-paginator>
  }
</div>
